<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GenAI Playground</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}input,textarea,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{cursor:pointer;background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px;border-radius:9px}</style><h1>GenAI Playground</h1><p>Prompt library and model preview</p><input id="api" value="https://genai-playground-api.onrender.com" aria-label="API URL"><input id="name" placeholder="Prompt name"><textarea id="template" placeholder="Write template, use {topic}"></textarea><button onclick="save()">Save prompt</button><input id="vars" value='{"topic":"AI"}'><button onclick="runPrompt()">Run prompt</button><pre id="out">Ready</pre><script>async function call(path,body){let r=await fetch(api.value+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();out.textContent=JSON.stringify(j,null,2)}function save(){call('/prompts',{name:name.value,template:template.value})}function runPrompt(){call('/run',{name:name.value,variables:JSON.parse(vars.value)})}</script></html>
